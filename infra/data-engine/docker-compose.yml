services:
  postgres:
    image: postgres:16-alpine
    container_name: rifnote-postgres
    restart: unless-stopped
    env_file:
      - ./env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rifnote_data}
      POSTGRES_USER: ${POSTGRES_USER:-rifnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rifnote_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rifnote} -d ${POSTGRES_DB:-rifnote_data}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: rifnote-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in env.local}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - rifnote_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  rifnote_postgres_data:
  rifnote_redis_data:
