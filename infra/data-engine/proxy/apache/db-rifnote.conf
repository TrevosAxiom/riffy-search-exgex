<VirtualHost *:80>
    ServerName db.rifnote.com

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName db.rifnote.com

    SSLEngine On
    SSLCertificateFile /usr/local/apps/apache2/etc/ssl/rifnote/db-rifnote.crt
    SSLCertificateKeyFile /usr/local/apps/apache2/etc/ssl/rifnote/db-rifnote.key

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    <Location />
        AuthType Basic
        AuthName "Rifnote Database Console"
        AuthUserFile /usr/local/apps/apache2/etc/conf.d/.rifnote-pgadmin.htpasswd
        Require valid-user
    </Location>

    ProxyPass / http://127.0.0.1:5050/
    ProxyPassReverse / http://127.0.0.1:5050/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog /usr/local/apps/apache2/logs/db-rifnote-error.log
    CustomLog /usr/local/apps/apache2/logs/db-rifnote-access.log combined
</VirtualHost>
