<VirtualHost *:443>
    ServerName data.rifnote.com

    SSLEngine On
    SSLCertificateFile /path/to/data.rifnote.com/fullchain.pem
    SSLCertificateKeyFile /path/to/data.rifnote.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /usr/local/apps/apache2/logs/data-rifnote-ssl-error.log
    CustomLog /usr/local/apps/apache2/logs/data-rifnote-ssl-access.log combined
</VirtualHost>

