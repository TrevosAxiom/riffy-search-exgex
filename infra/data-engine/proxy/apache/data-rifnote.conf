<VirtualHost 163.245.208.92:80>
    ServerName data.rifnote.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog /usr/local/apps/apache2/logs/data-rifnote-error.log
    CustomLog /usr/local/apps/apache2/logs/data-rifnote-access.log combined
</VirtualHost>
